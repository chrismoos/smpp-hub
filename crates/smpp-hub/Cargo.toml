[package]
name = "smpp-hub"
publish = false
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Chris Moos"]
repository = "https://github.com/chrismoos/smpp-hub"
readme = "../../README.md"
keywords = ["smpp", "sms", "smsc", "telecom"]
categories = ["network-programming"]
description = "Store-and-forward SMPP hub with durable queues and delivery reports."

[features]
default = ["standalone"]
standalone = ["dep:sqlx", "dep:clap", "dep:tracing-subscriber"]
schema = ["dep:utoipa"]

[dependencies]
smpp-core = { version = "0.1.1", path = "../smpp-core" }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", optional = true, features = ["runtime-tokio-rustls", "sqlite"] }
clap = { version = "4", optional = true, features = ["derive"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
utoipa = { version = "5", optional = true, features = ["uuid", "chrono"] }

[lints]
workspace = true

[[bin]]
name = "smpp-hub"
path = "src/main.rs"
required-features = ["standalone"]
